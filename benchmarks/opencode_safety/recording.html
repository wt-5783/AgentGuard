<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentGuard · 功能实演</title>
<style>
:root{color-scheme:dark;--bg:#0b1019;--panel:#131d2b;--line:#2a384c;--text:#ebf1fa;--muted:#a2b1c5;--blue:#aac7ff;--green:#7de0bb;--red:#ffa49a;--amber:#edcb8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,"Noto Sans CJK SC",sans-serif}button,select{font:inherit}button{cursor:pointer;background:#adcbff;color:#10213b;border:1px solid transparent;border-radius:8px;padding:10px 16px;font-weight:650}button:disabled{opacity:.4;cursor:default}.secondary{color:var(--text);background:transparent;border-color:var(--line)}button:hover:enabled{filter:brightness(1.13)}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:4px}a{color:var(--blue)}p{line-height:1.6;margin:6px 0;color:var(--muted)}h1,h2,h3{margin:0}h1{font-size:28px;letter-spacing:-.5px}h2{font-size:17px}h3{font-size:14px}header{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:22px 30px 12px;gap:16px}.brand{font-size:19px;font-weight:750;letter-spacing:.5px}.brand span{font-weight:400;color:var(--muted);font-size:13px;margin-left:12px}.top-actions{display:flex;gap:8px}.top-actions button{font-size:13px;padding:8px 12px}main{max-width:1500px;margin:auto;padding:12px 30px 24px}.chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}.chapters button{text-align:left;background:#121c29;color:var(--muted);border-color:var(--line);padding:13px 16px}.chapters button[aria-current=step]{background:#1c2f48;color:var(--text);border-color:#769bd0}.chapters b{color:var(--blue);font:12px ui-monospace,monospace;margin-right:10px}.scene-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:var(--blue);margin-bottom:9px}.source-badge{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.source-badge.live{color:var(--green);border-color:#377361}.source-badge.history{color:var(--amber);border-color:#71603e}.taskbar{display:grid;grid-template-columns:1.4fr 1fr auto;gap:20px;padding:15px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;align-items:center}.taskbar p{font-size:13px;color:var(--text);margin-bottom:0}.taskbar small{font-size:11px;color:var(--muted)}.taskbar button{font-size:12px;padding:8px 10px}.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lane{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;min-width:0}.lane-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.lane-head h2{font-size:16px}.off .lane-head h2{color:var(--amber)}.on .lane-head h2{color:var(--green)}.phase{font-size:12px;color:var(--muted);text-align:right}.stats{display:flex;gap:20px;padding:11px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}.stats b{font-size:17px;color:var(--text);margin-left:5px}.artifact{margin:14px 18px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0c1522}.artifact-head{font:12px ui-monospace,monospace;color:var(--blue);padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between}.artifact-head span{font:11px system-ui;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font:13px ui-monospace,"Noto Sans CJK SC",monospace;line-height:1.7}.artifact pre{height:154px;overflow:auto;padding:13px}.artifact.empty pre{color:var(--muted)}.before{padding:8px 12px;color:var(--muted);font:11px ui-monospace,monospace;border-bottom:1px solid var(--line)}.explanations{padding:0 18px}.explanation{margin-top:12px;border-left:3px solid var(--red);padding:7px 12px;background:#2b1d27;border-radius:0 6px 6px 0}.explanation strong{font-size:14px;color:var(--red)}.explanation p{font-size:12px;color:var(--text);line-height:1.5}.explanation.error{border-color:var(--amber);background:#28241c}.explanation.error strong{color:var(--amber)}.explanation.info,.explanation.redact{border-color:var(--blue);background:#19283a}.explanation.info strong,.explanation.redact strong{color:var(--blue)}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{border:1px solid var(--line);border-radius:4px;padding:3px 6px;color:var(--muted);font-size:11px}.explanation .chip{color:inherit}.timeline{padding:12px 18px;min-height:112px}.timeline p{font-size:12px;margin:3px 0;line-height:1.5;color:var(--muted)}.timeline time{color:#738aa7;margin-right:9px;font:10px ui-monospace,monospace}.timeline .block{color:var(--red)}.timeline .fault{color:var(--amber)}.lane-tools{border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:10px 18px;gap:10px}.lane-tools button{padding:0;color:var(--blue);font-size:12px;background:none;border:none}.controls{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px}.controls .actions{display:flex;gap:8px;align-items:center}.controls p{font-size:12px;margin:0}.controls button{white-space:nowrap}#run{min-width:180px}#notice{min-height:19px;font-size:12px;color:var(--blue);margin-top:8px}.record-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#8598b0;font:11px ui-monospace,monospace;margin-top:12px}.underbar{margin-top:15px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:15px}.underbar p{font-size:12px}.underbar button{padding:6px 9px;font-size:12px}.help{margin-top:14px;font-size:12px;color:var(--muted)}dialog{background:#131d2b;color:var(--text);width:min(1000px,94vw);max-height:90vh;border:1px solid #415571;border-radius:12px;padding:24px}dialog::backdrop{background:#020812cc}dialog .close{float:right}dialog h2{margin-bottom:16px}dialog h3{margin:18px 0 8px}dialog pre{padding:14px;background:#0c1522;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:7px;font-size:12px}dialog p{font-size:13px}dialog select{margin:12px 0 16px;padding:12px;width:100%;background:#0c1522;border:1px solid var(--line);border-radius:6px;color:var(--text)}details{margin:16px 0}summary{cursor:pointer;color:var(--blue);font-size:13px}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.evidence-card{border:1px solid var(--line);padding:12px;border-radius:7px}.evidence-card h3{margin:0 0 10px}kbd{border:1px solid var(--line);border-radius:3px;padding:2px 5px;font-size:11px}#exit-recording{display:none}.recording .editor-only{display:none!important}.recording #exit-recording{display:block}.recording main{padding-top:16px}.recording header{padding-top:16px}.recording .artifact pre{height:185px}.recording .chapters{margin-bottom:20px}.recording .controls{margin-top:14px}.recording .taskbar{margin-bottom:18px}body.embedded header .home-link{display:none}[hidden]{display:none!important}@media(min-width:1700px){main{padding-top:22px}.artifact pre{height:200px}.recording .artifact pre{height:230px}}@media(max-width:1000px){header,main{padding-left:18px;padding-right:18px}h1{font-size:23px}.taskbar{grid-template-columns:1fr 1fr;gap:12px}.taskbar button{grid-column:1/-1;justify-self:start}.chapters button{padding:11px 9px;font-size:12px}.stats{gap:10px;padding:10px 12px}.artifact{margin:12px 12px 0}.explanations,.timeline{padding-left:12px;padding-right:12px}.controls{align-items:flex-start}.controls .actions{flex-wrap:wrap}}@media(max-width:650px){.lanes{grid-template-columns:1fr}.chapters{grid-template-columns:1fr 1fr}.taskbar{grid-template-columns:1fr}.controls,.scene-top,.underbar{flex-direction:column}.evidence-grid{grid-template-columns:1fr}header .brand span{display:none}}
/* Keep the actual file, intervention and controls together in a 720p recording. */
.artifact-open{font:inherit;color:var(--blue);padding:0;background:transparent;border:0;text-align:left}.artifact-open:disabled{opacity:1;cursor:default}
.lane{display:flex;flex-direction:column}.lane-tools{margin-top:auto}
@media(min-width:850px) and (max-height:850px){
.recording header{padding:8px 24px 5px}.recording main{padding:6px 24px 10px}.recording .brand{font-size:16px}.recording .top-actions button{padding:5px 9px;font-size:11px}.recording .chapters{margin-bottom:10px;gap:7px}.recording .chapters button{padding:8px 12px;font-size:12px}.recording .scene-top{margin-bottom:10px;align-items:center}.recording h1{font-size:23px}.recording .eyebrow{font-size:9px;margin-bottom:4px}.recording .taskbar{padding:9px 14px;margin-bottom:10px;gap:15px}.recording .taskbar p{font-size:12px;line-height:1.4}.recording .lane-head{padding:10px 14px}.recording .stats{padding:7px 14px}.recording .stats b{font-size:15px}.recording .artifact{margin:10px 14px 0}.recording .artifact-head{padding:7px 10px}.recording .artifact pre{height:82px;padding:9px 10px;font-size:12px;line-height:1.5}.recording .before{padding:6px 10px}.recording .explanations{padding:0 14px}.recording .explanation{margin-top:9px;padding:6px 9px}.recording .explanation strong{font-size:12px}.recording .explanation p{font-size:11px;margin:4px 0 0}.recording .chips{margin-top:4px}.recording .chip{font-size:10px;padding:2px 4px}.recording .timeline{padding:7px 14px;min-height:47px}.recording .timeline p{font-size:11px;margin:2px 0}.recording .timeline p:nth-last-child(n+3){display:none}.recording .lane-tools{padding:7px 14px}.recording .lane-tools button{font-size:11px}.recording .controls{margin-top:10px;gap:10px}.recording .controls button{padding:8px 12px;font-size:12px}.recording #run{min-width:155px}.recording #notice{margin:5px 0 0;font-size:11px;min-height:14px}.recording .record-line{margin-top:5px;font-size:10px}.recording .underbar{margin-top:7px;padding-top:7px;align-items:center}.recording .underbar p{font-size:11px;margin:0}.recording .underbar button{font-size:10px;padding:4px 7px}
}
</style></head><body>
<header><div class="brand">AgentGuard<span>真实场景 · 功能实演</span></div><div class="top-actions"><button id="history" class="secondary editor-only">已有记录</button><button id="recording" class="secondary editor-only">进入录制模式</button><button id="exit-recording" class="secondary">退出录制</button></div></header>
<main>
<nav id="chapters" class="chapters" aria-label="演示顺序"></nav>
<section class="scene-top"><div><div class="eyebrow" id="chapter-number">SCENE 01 / 04</div><h1 id="scene-title">正在加载场景</h1></div><span id="source-badge" class="source-badge">尚未运行</span></section>
<section class="taskbar"><div><small>同一个任务 · 两侧相同输入</small><p id="task"></p></div><div><small>可信授权边界</small><p id="boundary"></p></div><button id="inputs" class="secondary">查看任务资料</button></section>
<section id="lanes" class="lanes" aria-label="真实 ON OFF 对照"></section>
<section class="controls"><div><p id="watch"></p><p class="editor-only">点击运行会启动两个真实 OpenCode 会话并调用云端模型。</p></div><div class="actions"><button id="stop" class="secondary" hidden>停止本次</button><button id="run" disabled>运行这一幕</button><button id="next" class="secondary">下一幕 →</button></div></section>
<p id="notice" role="status"></p><div id="record-line" class="record-line"></div>
<section class="underbar"><p id="isolation">隔离检查将在运行时执行 · 仅使用合成文件与本机接收端</p><div><button id="environment" class="secondary" disabled>查看隔离与接入证据</button><button id="native-help" class="secondary editor-only">终端镜头怎么录</button></div></section>
<p class="help editor-only">操作顺序：选一幕 → 运行 → 查看真实产物 → 下一幕。录制模式隐藏辅助入口；方向键切幕，Esc 退出录制。</p>
</main>
<dialog id="dialog"><button class="secondary close" id="close-dialog">关闭</button><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog>
<script>__PRESENTATION__</script><script>__RECORDING_MODEL__</script><script>__SCRIPT__</script>
</body></html>
